name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mahjong
          POSTGRES_PASSWORD: mahjong
          POSTGRES_DB: mahjong_dynasty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahjong -d mahjong_dynasty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mahjong:mahjong@localhost:5432/mahjong_dynasty?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      WEB_ORIGIN: http://localhost:5173
      API_PORT: '4000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (unit + integration against PostgreSQL)
        run: npm test

      - name: Build
        run: npm run build

      - name: Simulation smoke test
        run: npm run simulate -- --spins=20000 --seed=1
