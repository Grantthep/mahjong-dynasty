# Serves the built web app and forwards /api to the API container ("api" on the compose network).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API answers with JSON only; the browser talks to it on the same origin.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite's build output has a content hash in its name (GamePage-B8gWXy8e.js), so it can be cached
    # for a year. Files copied from public/assets (sounds, artwork) keep their names, so they must
    # be re-checked: a replaced sound or symbol shows up within the hour.
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths (/game, /admin, ...) get index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
