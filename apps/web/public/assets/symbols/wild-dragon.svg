<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132">
  <defs>
  <linearGradient id="face" x1="0.1" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#FFFAEC"/><stop offset="0.55" stop-color="#F4EBD7"/><stop offset="1" stop-color="#DCCBA6"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#258A70"/><stop offset="0.5" stop-color="#146B57"/><stop offset="1" stop-color="#0A3128"/>
  </linearGradient>
  <linearGradient id="jadeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2FAA8A"/><stop offset="1" stop-color="#0E5A47"/>
  </linearGradient>
  <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D04A3A"/><stop offset="1" stop-color="#7A1818"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2D27C"/><stop offset="0.5" stop-color="#D6A84B"/><stop offset="1" stop-color="#9A7420"/>
  </linearGradient>
  <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.7">
    <stop offset="0" stop-color="#fff" stop-opacity="0.65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <filter id="drop" x="-20%" y="-15%" width="140%" height="150%">
    <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>

    <linearGradient id="darkJade" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1F8A72"/><stop offset="0.5" stop-color="#0F4A3C"/><stop offset="1" stop-color="#05201A"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#F2D27C" stop-opacity="0.55"/><stop offset="1" stop-color="#D6A84B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="6" y="12" width="108" height="114" rx="17" fill="#04150F"/>
    <rect x="6" y="6" width="108" height="112" rx="17" fill="url(#darkJade)" stroke="url(#goldGrad)" stroke-width="2.4"/>
  </g>
  <rect x="11" y="11" width="98" height="102" rx="12" fill="none" stroke="#F2D27C" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="6" y="6" width="108" height="112" rx="17" fill="url(#sheen)" opacity="0.35"/>
  <ellipse cx="60" cy="58" rx="46" ry="44" fill="url(#aura)"/>

  <!-- coiling body around the tile -->
  
    <path d="M24 106 C 3 92, 3 40, 30 20" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M24 106 C 3 92, 3 40, 30 20" fill="none" stroke="#7A5A16" stroke-width="7" stroke-dasharray="1.4 4.2" opacity="0.7"/>
    <path d="M24 106 C 3 92, 3 40, 30 20" fill="none" stroke="#258A70" stroke-width="1.4" stroke-linecap="round" opacity="0.8" transform="translate(-1.6 -1.6)"/>
  
    <path d="M96 106 C 117 92, 117 44, 92 22" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M96 106 C 117 92, 117 44, 92 22" fill="none" stroke="#7A5A16" stroke-width="7" stroke-dasharray="1.4 4.2" opacity="0.7"/>
    <path d="M96 106 C 117 92, 117 44, 92 22" fill="none" stroke="#258A70" stroke-width="1.4" stroke-linecap="round" opacity="0.8" transform="translate(-1.6 -1.6)"/>
  
    <path d="M26 20 C 40 8, 80 8, 94 20" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M26 20 C 40 8, 80 8, 94 20" fill="none" stroke="#7A5A16" stroke-width="5" stroke-dasharray="1.4 4.2" opacity="0.7"/>
    <path d="M26 20 C 40 8, 80 8, 94 20" fill="none" stroke="#258A70" stroke-width="1.4" stroke-linecap="round" opacity="0.8" transform="translate(-1.6 -1.6)"/>
  <path d="M22 108 l-5 8 9 -3z" fill="url(#goldGrad)"/>
  <path d="M98 108 l5 8 -9 -3z" fill="url(#goldGrad)"/>

  <!-- emblem: golden dragon head -->
  <g filter="url(#glow)">
    <circle cx="60" cy="58" r="27" fill="#062A22" stroke="url(#goldGrad)" stroke-width="2.4"/>
    <circle cx="60" cy="58" r="22.5" fill="none" stroke="#D6A84B" stroke-opacity="0.5" stroke-width="0.8"/>
    <g transform="translate(60 60) scale(0.8)">
      <path d="M-30 -18 C-24 -38 -8 -46 6 -40 C0 -34 -6 -30 -8 -22 Z" fill="url(#goldGrad)"/>
      <path d="M-4 -26 C-2 -46 12 -56 26 -52 C18 -46 14 -38 14 -26 Z" fill="url(#goldGrad)"/>
      <path d="M-32 -6 C-30 -26 -8 -30 14 -24 L44 -18 C54 -16 54 -2 44 2 L20 8 C4 22 -24 20 -32 -6 Z" fill="url(#goldGrad)" stroke="#7A5A16" stroke-width="1.2"/>
      <path d="M8 6 C24 18 40 12 46 2 L44 12 C36 26 14 28 4 16 Z" fill="#B98A2E"/>
      <path d="M-30 4 C-44 14 -46 30 -38 40 C-38 26 -26 18 -14 14 Z" fill="#258A70" stroke="#F2D27C" stroke-width="0.8"/>
      <circle cx="12" cy="-10" r="5.6" fill="#FFF3B5"/><circle cx="13" cy="-10" r="2.4" fill="#5A1010"/>
      <circle cx="46" cy="-8" r="2" fill="#5A3A08"/>
      <path d="M46 -2 C64 8 70 26 62 40" stroke="#F2D27C" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M44 -14 C58 -26 64 -22 68 -32" stroke="#F2D27C" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- WILD plate -->
  <rect x="33" y="100" width="54" height="14" rx="7" fill="#04201A" stroke="url(#goldGrad)" stroke-width="1.6"/>
  <text x="60" y="110.4" font-size="9.5" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-weight="700" letter-spacing="2" fill="#F2D27C">WILD</text>

  <circle cx="20" cy="34" r="1.6" fill="#F2D27C" opacity="0.9"/><circle cx="100" cy="40" r="1.4" fill="#F2D27C" opacity="0.9"/><circle cx="16" cy="76" r="1.2" fill="#F2D27C" opacity="0.7"/><circle cx="104" cy="84" r="1.7" fill="#F2D27C" opacity="0.9"/><circle cx="60" cy="16" r="1.3" fill="#F2D27C" opacity="0.9"/><circle cx="84" cy="96" r="1.1" fill="#F2D27C" opacity="0.7"/>
</svg>
